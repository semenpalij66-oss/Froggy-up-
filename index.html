<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Froggy Up!</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <!-- ==================== AD SDK ====================
         Adsgram SDK, два юнита из кабинета partner.adsgram.ai:
         - Reward (UnitID 48755)     — revive / скин за рекламу / +10 монет
         - Interstitial (UnitID int-48763) — межстраничная, раз в 2.5 мин,
           показывается только по клику RESTART (см. блок "AD PLACEHOLDER").
         ================================================== -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            height: 100%;
            margin: 0;
        }
        body {
            background-color: #050811;
            color: #ffffff;
            font-family: 'Press Start 2P', monospace;
            position: relative;
            overflow: hidden;
        }
        #game-container {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 400px;
            height: 600px;
            transform-origin: center center;
            /* transform (translate + scale) выставляется из JS в resizeGameToFitWindow() */
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.9), 0 0 25px rgba(34, 197, 94, 0.25);
            border: 4px solid #0f2318;
            border-radius: 8px;
            overflow: hidden;
        }
        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            background: #0284c7;
            touch-action: none;
        }
        .ui-layer {
            position: absolute;
            top: 14px;
            left: 75px;
            right: 75px;
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: #ffffff;
            text-shadow: 2px 2px 0px #000, -1px -1px 0 #000;
            pointer-events: none;
            z-index: 10;
        }

        /* --- ГЛАВНОЕ МЕНЮ --- */
        #main-menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 50px 20px 60px 20px;
            z-index: 30;
            transition: opacity 0.4s ease;
        }
        #main-menu.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .menu-title {
            font-size: 26px;
            color: #4ade80;
            text-shadow: 4px 4px 0 #052e16, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
            text-align: center;
            animation: floatTitle 2.5s ease-in-out infinite;
        }
        @keyframes floatTitle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
            width: 100%;
        }

        .btn-lang {
            background: #4f46e5;
            box-shadow: 0 6px 0 #312e81, 0 8px 10px rgba(0,0,0,0.5);
            font-size: 9px;
            padding: 12px 20px;
        }
        .btn-lang:hover {
            background: #6366f1;
        }
        .btn-lang:active {
            box-shadow: 0 2px 0 #312e81;
        }
        .lang-btn-inner {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .lang-flag-canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            width: 20px;
            height: 14px;
            border: 1px solid #050811;
            flex-shrink: 0;
        }
        #lang-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.75);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 60;
        }
        #lang-modal.active {
            display: flex;
        }
        .lang-box {
            background: #0f2318;
            border: 3px solid #22c55e;
            border-radius: 8px;
            padding: 18px;
            width: 300px;
            max-width: 86%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
        }
        .lang-title {
            font-size: 11px;
            color: #4ade80;
            text-align: center;
            margin-bottom: 14px;
            text-shadow: 2px 2px 0 #000;
        }
        .lang-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            max-height: 260px;
            overflow-y: auto;
        }
        .lang-option {
            background: #14532d;
            color: #fff;
            border: 2px solid #052e16;
            padding: 8px 6px;
            font-size: 8px;
            font-family: 'Press Start 2P', monospace;
            cursor: pointer;
            text-align: center;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .lang-option .lang-flag-canvas {
            width: 18px;
            height: 12px;
            flex-shrink: 0;
        }
        .lang-option:hover {
            background: #16a34a;
        }
        .lang-option.active {
            background: #4ade80;
            color: #052e16;
        }
        .lang-close-btn {
            width: 100%;
            margin-top: 14px;
            font-size: 10px;
            padding: 10px;
        }


        .pixel-btn {
            background: #22c55e;
            color: #fff;
            border: 3px solid #052e16;
            padding: 14px 28px;
            font-size: 12px;
            font-family: 'Press Start 2P', monospace;
            cursor: pointer;
            box-shadow: 0 6px 0 #14532d, 0 8px 10px rgba(0,0,0,0.5);
            transition: transform 0.1s, background 0.2s, box-shadow 0.1s;
            text-shadow: 2px 2px 0 #000;
            width: 200px;
            text-align: center;
        }
        .pixel-btn:hover {
            background: #4ade80;
        }
        .pixel-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #14532d;
        }

        .btn-music {
            background: #0284c7;
            box-shadow: 0 6px 0 #0369a1, 0 8px 10px rgba(0,0,0,0.5);
            font-size: 10px;
            padding: 12px 20px;
        }
        .btn-music:hover {
            background: #38bdf8;
        }
        .btn-music:active {
            box-shadow: 0 2px 0 #0369a1;
        }
        .btn-music.off {
            background: #64748b;
            box-shadow: 0 6px 0 #334155, 0 8px 10px rgba(0,0,0,0.5);
            color: #cbd5e1;
        }

        /* --- КНОПКА "ВОЗРОДИТЬСЯ ЗА РЕКЛАМУ" --- */
        .btn-revive {
            background: #f59e0b;
            box-shadow: 0 6px 0 #92400e, 0 8px 10px rgba(0,0,0,0.5);
            font-size: 9px;
            padding: 12px 14px;
            width: 220px;
            margin-bottom: 14px;
        }
        .btn-revive:hover {
            background: #fbbf24;
        }
        .btn-revive:active {
            box-shadow: 0 2px 0 #92400e;
        }
        .btn-revive.hidden {
            display: none;
        }

        /* --- КНОПКА "+10 МОНЕТ ЗА РЕКЛАМУ" В ПАУЗЕ --- */
        .btn-pause-coin {
            background: #f59e0b;
            box-shadow: 0 6px 0 #92400e, 0 8px 10px rgba(0,0,0,0.5);
            font-size: 9px;
            padding: 12px 10px;
            width: 100%;
            margin-top: 14px;
        }
        .btn-pause-coin:hover {
            background: #fbbf24;
        }
        .btn-pause-coin:active {
            box-shadow: 0 2px 0 #92400e;
        }
        .btn-pause-coin.on-cooldown {
            background: #64748b;
            box-shadow: 0 6px 0 #334155, 0 8px 10px rgba(0,0,0,0.5);
            color: #cbd5e1;
            cursor: default;
            font-size: 8px;
        }
        .btn-pause-coin.on-cooldown:active {
            box-shadow: 0 6px 0 #334155, 0 8px 10px rgba(0,0,0,0.5);
        }

        /* --- КНОПКА "ПОЛУЧИТЬ СКИН ЗА РЕКЛАМУ" В МАГАЗИНЕ --- */
        .skin-ad-unlock {
            margin-top: 4px;
            font-size: 6px;
            padding: 3px 5px;
            background: #f59e0b;
            color: #451a03;
            border: 1px solid #451a03;
            text-align: center;
            cursor: pointer;
        }
        .skin-ad-unlock:hover {
            background: #fbbf24;
        }

        /* Экран Game Over */
        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 30, 40, 0.92);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 20;
        }
        #game-over-screen.active {
            opacity: 1;
            pointer-events: auto;
        }
        h1 {
            font-size: 22px;
            color: #facc15;
            text-shadow: 3px 3px 0 #713f12, -2px -2px 0 #000;
            margin-bottom: 20px;
            text-align: center;
            line-height: 1.4;
        }
        p {
            font-size: 11px;
            margin-bottom: 28px;
            color: #e0f2fe;
            text-shadow: 1px 1px 0 #000;
        }

        /* --- МАГАЗИН --- */
        #shop-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 20% 10%, rgba(56, 189, 248, 0.25), transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(74, 222, 128, 0.18), transparent 40%),
                linear-gradient(180deg, #0c4a6e 0%, #075985 35%, #0369a1 70%, #0c4a6e 100%);
            display: flex;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 40;
        }
        #shop-screen.active {
            opacity: 1;
            pointer-events: auto;
        }
        #shop-screen::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(ellipse 30px 10px at 15% 20%, rgba(74, 222, 128, 0.35), transparent 70%),
                radial-gradient(ellipse 24px 8px at 80% 12%, rgba(74, 222, 128, 0.3), transparent 70%),
                radial-gradient(ellipse 26px 9px at 60% 90%, rgba(74, 222, 128, 0.25), transparent 70%),
                radial-gradient(ellipse 20px 7px at 10% 75%, rgba(125, 211, 252, 0.3), transparent 70%);
            pointer-events: none;
        }
        .shop-header {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 12px;
            background: #78350f;
            border-bottom: 4px solid #451a03;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            z-index: 2;
        }
        .shop-back-btn {
            background: #fde68a;
            color: #451a03;
            border: 3px solid #451a03;
            width: 34px;
            height: 34px;
            font-size: 14px;
            font-family: 'Press Start 2P', monospace;
            cursor: pointer;
            box-shadow: 0 4px 0 #92400e;
        }
        .shop-back-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #92400e;
        }
        .shop-title {
            font-size: 14px;
            color: #fde68a;
            text-shadow: 2px 2px 0 #451a03;
        }
        .shop-coins {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #fde68a;
            border: 3px solid #451a03;
            padding: 6px 10px;
            font-size: 11px;
            color: #451a03;
        }
        #shop-coin-icon {
            image-rendering: pixelated;
            width: 14px;
            height: 14px;
        }
        .shop-grid {
            position: relative;
            flex: 1;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 14px;
            overflow-y: auto;
            z-index: 1;
        }
        .skin-card {
            background: rgba(6, 78, 59, 0.55);
            border: 3px solid #052e16;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px 4px 6px 4px;
            cursor: pointer;
            transition: transform 0.1s, background 0.15s;
        }
        .skin-card:hover {
            transform: translateY(-2px);
            background: rgba(6, 78, 59, 0.8);
        }
        .skin-card.equipped {
            border-color: #4ade80;
            background: rgba(34, 197, 94, 0.35);
            box-shadow: 0 0 0 2px #4ade80, 0 0 12px rgba(74, 222, 128, 0.6);
        }
        .skin-card.locked {
            opacity: 0.92;
        }
        .skin-card canvas {
            image-rendering: pixelated;
            width: 52px;
            height: 52px;
        }
        .skin-name {
            font-size: 7px;
            color: #ecfdf5;
            text-shadow: 1px 1px 0 #000;
            margin-top: 4px;
            text-align: center;
        }
        .skin-price {
            margin-top: 4px;
            font-size: 7px;
            padding: 2px 4px;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            border: 1px solid #451a03;
            line-height: 1;
        }
        .skin-price.can-buy {
            background: #fbbf24;
            color: #451a03;
        }
        .skin-price.cant-buy {
            background: #64748b;
            color: #e2e8f0;
        }
        .skin-price.owned {
            background: #4ade80;
            color: #052e16;
        }
        .skin-price.selected-tag {
            background: #22c55e;
            color: #052e16;
        }
        .mini-coin-canvas {
            image-rendering: pixelated;
            width: 7px !important;
            height: 7px !important;
            vertical-align: middle;
            flex-shrink: 0;
        }

        /* --- ПОДТВЕРЖДЕНИЕ ПОКУПКИ --- */
        #confirm-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 20, 30, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            z-index: 50;
        }
        #confirm-modal.active {
            opacity: 1;
            pointer-events: auto;
        }
        .confirm-box {
            background: #0f766e;
            border: 4px solid #052e16;
            box-shadow: 0 8px 0 #052e16, 0 10px 16px rgba(0,0,0,0.5);
            padding: 18px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 220px;
        }
        .confirm-preview {
            image-rendering: pixelated;
            width: 56px;
            height: 56px;
            margin-bottom: 8px;
        }
        .confirm-text {
            font-size: 9px;
            color: #ecfdf5;
            text-align: center;
            text-shadow: 1px 1px 0 #000;
            line-height: 1.6;
            margin-bottom: 14px;
        }
        .confirm-text .confirm-name {
            color: #fde68a;
        }
        .confirm-buttons {
            display: flex;
            gap: 10px;
        }
        .confirm-btn {
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            border: 3px solid #052e16;
            padding: 8px 14px;
            cursor: pointer;
            text-shadow: 1px 1px 0 #000;
        }
        .confirm-yes {
            background: #22c55e;
            color: #fff;
            box-shadow: 0 4px 0 #14532d;
        }
        .confirm-yes:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #14532d;
        }
        .confirm-no {
            background: #ef4444;
            color: #fff;
            box-shadow: 0 4px 0 #7f1d1d;
        }
        .confirm-no:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #7f1d1d;
        }

        /* --- ПАУЗА --- */
        #pause-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 20, 30, 0.55);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            z-index: 55;
        }
        #pause-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .pause-box {
            background: #0c4a6e;
            border: 4px solid #052e16;
            box-shadow: 0 8px 0 #052e16, 0 10px 16px rgba(0,0,0,0.5);
            padding: 20px 22px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 200px;
        }
        .pause-frog-canvas {
            image-rendering: pixelated;
            width: 64px;
            height: 64px;
            margin-bottom: 10px;
        }
        .pause-title {
            font-size: 14px;
            color: #4ade80;
            text-shadow: 2px 2px 0 #000;
            margin-bottom: 16px;
            text-align: center;
        }
        .pause-resume-btn {
            width: 100%;
            font-size: 10px;
            padding: 12px;
        }

        /* --- ОБРАТНЫЙ ОТСЧЁТ --- */
        #countdown-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s ease;
            z-index: 56;
        }
        #countdown-overlay.active {
            opacity: 1;
        }
        .countdown-text {
            font-size: 34px;
            color: #fef08a;
            text-shadow: 3px 3px 0 #000, -2px -2px 0 #052e16, 2px -2px 0 #052e16, -2px 2px 0 #052e16, 2px 2px 0 #052e16;
            animation: countdownPulse 0.5s ease;
        }
        @keyframes countdownPulse {
            0% { transform: scale(0.4); opacity: 0; }
            60% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <div class="ui-layer">
        <span id="score-text">SCORE: 0</span>
        <span id="high-score-text">BEST: 0</span>
    </div>

    <!-- ГЛАВНОЕ МЕНЮ -->
    <div id="main-menu">
        <h1 class="menu-title">Froggy Up!</h1>
        <div class="menu-buttons">
            <button id="play-btn" class="pixel-btn">PLAY</button>
            <button id="lang-btn" class="pixel-btn btn-lang">
                <span class="lang-btn-inner">
                    <canvas id="lang-flag-icon" width="20" height="14" class="lang-flag-canvas"></canvas>
                    <span id="lang-btn-text">Language: ENG</span>
                </span>
            </button>
            <button id="music-btn" class="pixel-btn btn-music">Music: ON</button>
        </div>
    </div>

    <!-- ВЫБОР ЯЗЫКА -->
    <div id="lang-modal">
        <div class="lang-box">
            <div class="lang-title">LANGUAGE</div>
            <div class="lang-grid" id="lang-grid"></div>
            <button id="lang-close-btn" class="pixel-btn lang-close-btn">CLOSE</button>
        </div>
    </div>

    <canvas id="canvas" width="400" height="600"></canvas>

    <!-- ЭКРАН ПРОИГРЫША -->
    <div id="game-over-screen">
        <h1>SPLASH!<br>GAME OVER</h1>
        <p id="final-score">SCORE: 0</p>
        <button id="revive-btn" class="pixel-btn btn-revive">WATCH AD TO REVIVE <span id="revive-count">(0/3)</span></button>
        <button id="restart-btn" class="pixel-btn">PLAY AGAIN</button>
    </div>

    <!-- МАГАЗИН СКИНОВ -->
    <div id="shop-screen">
        <div class="shop-header">
            <button id="shop-back-btn" class="shop-back-btn">&#9664;</button>
            <span class="shop-title">FROG SHOP</span>
            <div class="shop-coins">
                <canvas id="shop-coin-icon" width="20" height="20"></canvas>
                <span id="shop-coins-text">0</span>
            </div>
        </div>
        <div class="shop-grid" id="shop-grid"></div>

        <!-- ПОДТВЕРЖДЕНИЕ ПОКУПКИ -->
        <div id="confirm-modal">
            <div class="confirm-box">
                <canvas id="confirm-preview" class="confirm-preview" width="40" height="40"></canvas>
                <div class="confirm-text"><span id="confirm-prefix">Buy skin</span><br><span class="confirm-name" id="confirm-name">RED</span><br><span id="confirm-for">for</span> <span id="confirm-price">50</span> <span id="confirm-tokens">tokens?</span></div>
                <div class="confirm-buttons">
                    <button id="confirm-yes-btn" class="confirm-btn confirm-yes">YES</button>
                    <button id="confirm-no-btn" class="confirm-btn confirm-no">NO</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ПАУЗА -->
    <div id="pause-overlay">
        <div class="pause-box">
            <canvas id="pause-frog-canvas" width="72" height="72" class="pause-frog-canvas"></canvas>
            <div class="pause-title" id="pause-title">PAUSE</div>
            <button id="pause-resume-btn" class="pixel-btn pause-resume-btn">RESUME</button>
            <!-- БОНУС: +10 МОНЕТ ЗА РЕКЛАМУ (перезарядка 10 минут) -->
            <button id="pause-coin-btn" class="pixel-btn btn-pause-coin">+10 COINS (AD)</button>
        </div>
    </div>

    <!-- ОБРАТНЫЙ ОТСЧЁТ -->
    <div id="countdown-overlay">
        <div class="countdown-text" id="countdown-text">3</div>
    </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

// ==================== АДАПТИВНОЕ МАСШТАБИРОВАНИЕ (Y8: "responsive in resizing") ====================
// Вся игра (канвас 400x600 + все HTML-оверлеи поверх него: меню, магазин,
// пауза и т.д.) верстается в фиксированной "логической" системе координат
// 400x600 — как раньше. Чтобы игра корректно занимала весь доступный экран
// в любом окне/фрейме (десктоп, мобильный, разные пропорции при ресайзе
// плеера Y8), контейнер #game-container целиком масштабируется через
// CSS transform: scale(), сохраняя пропорции 2:3 и не обрезаясь. Так как
// внутри контейнера всё позиционируется в фиксированных пикселях
// относительно тех же 400x600, масштаб применяется к контейнеру одним
// множителем — переписывать вёрстку каждого элемента на проценты не нужно.
const gameContainer = document.getElementById('game-container');
const GAME_LOGICAL_WIDTH = 400;
const GAME_LOGICAL_HEIGHT = 600;

// window.innerWidth/innerHeight не всегда точны на мобильных (адресная
// строка, свайп-жесты) — если браузер поддерживает visualViewport, он
// точнее отражает реально видимую область.
function getViewportSize() {
    if (window.visualViewport) {
        return { width: window.visualViewport.width, height: window.visualViewport.height };
    }
    return { width: window.innerWidth, height: window.innerHeight };
}

function resizeGameToFitWindow() {
    const { width: availableWidth, height: availableHeight } = getViewportSize();
    const scale = Math.min(
        availableWidth / GAME_LOGICAL_WIDTH,
        availableHeight / GAME_LOGICAL_HEIGHT
    );
    // translate(-50%, -50%) центрирует контейнер относительно top:50%/left:50%,
    // scale() масштабирует — обе трансформации в одном свойстве, чтобы не
    // зависеть от flex-центрирования body (в embed-iframe Y8 оно иногда
    // рассинхронизируется и даёт визуальный сдвиг вниз/вбок).
    gameContainer.style.transform = `translate(-50%, -50%) scale(${scale})`;
}

resizeGameToFitWindow();

// Несколько независимых триггеров — событие 'resize' на window не всегда
// надёжно долетает, когда игра встроена в iframe на стороне портала
// (Y8 меняет размер именно iframe/плеера, а не самого window) или когда
// меняется полноэкранный режим. Дублируем разными способами, чтобы
// точно поймать любое изменение размера.
window.addEventListener('resize', resizeGameToFitWindow);
window.addEventListener('orientationchange', resizeGameToFitWindow);
document.addEventListener('fullscreenchange', resizeGameToFitWindow);
document.addEventListener('webkitfullscreenchange', resizeGameToFitWindow);
if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', resizeGameToFitWindow);
}
// ResizeObserver реагирует на реальное изменение размера видимой области
// документа независимо от того, что его вызвало — самый надёжный способ
// для нестандартных embed-сценариев на игровых порталах.
if (window.ResizeObserver) {
    new ResizeObserver(resizeGameToFitWindow).observe(document.documentElement);
}
// Финальная подстраховка: если вообще ни один из способов выше не
// сработал в конкретном embed-окружении портала, раз в полсекунды
// проверяем размер вручную и пересчитываем масштаб при расхождении.
let lastViewportW = getViewportSize().width;
let lastViewportH = getViewportSize().height;
setInterval(() => {
    const { width, height } = getViewportSize();
    if (width !== lastViewportW || height !== lastViewportH) {
        lastViewportW = width;
        lastViewportH = height;
        resizeGameToFitWindow();
    }
}, 500);

function drawSimpleStar(fctx, cx, cy, r, color) {
    fctx.fillStyle = color;
    fctx.beginPath();
    fctx.moveTo(cx, cy - r);
    fctx.lineTo(cx + r * 0.3, cy - r * 0.3);
    fctx.lineTo(cx + r, cy);
    fctx.lineTo(cx + r * 0.3, cy + r * 0.3);
    fctx.lineTo(cx, cy + r);
    fctx.lineTo(cx - r * 0.3, cy + r * 0.3);
    fctx.lineTo(cx - r, cy);
    fctx.lineTo(cx - r * 0.3, cy - r * 0.3);
    fctx.closePath();
    fctx.fill();
}

function drawFlagIcon(lang, targetCanvas) {
    const canvasEl = targetCanvas || langFlagIcon;
    const fctx = canvasEl.getContext('2d');
    fctx.imageSmoothingEnabled = false;
    const w = canvasEl.width, h = canvasEl.height;
    fctx.clearRect(0, 0, w, h);
    switch (lang) {
        case 'en': // UK Union Jack (simplified)
            fctx.fillStyle = '#0a17a3'; fctx.fillRect(0, 0, w, h);
            fctx.strokeStyle = '#ffffff'; fctx.lineWidth = h * 0.32;
            fctx.beginPath(); fctx.moveTo(0, 0); fctx.lineTo(w, h); fctx.stroke();
            fctx.beginPath(); fctx.moveTo(w, 0); fctx.lineTo(0, h); fctx.stroke();
            fctx.strokeStyle = '#c8102e'; fctx.lineWidth = h * 0.14;
            fctx.beginPath(); fctx.moveTo(0, 0); fctx.lineTo(w, h); fctx.stroke();
            fctx.beginPath(); fctx.moveTo(w, 0); fctx.lineTo(0, h); fctx.stroke();
            fctx.fillStyle = '#ffffff';
            fctx.fillRect(0, h / 2 - h * 0.22, w, h * 0.44);
            fctx.fillRect(w / 2 - w * 0.16, 0, w * 0.32, h);
            fctx.fillStyle = '#c8102e';
            fctx.fillRect(0, h / 2 - h * 0.1, w, h * 0.2);
            fctx.fillRect(w / 2 - w * 0.08, 0, w * 0.16, h);
            break;
        case 'uk': // Ukraine
            fctx.fillStyle = '#0057b7'; fctx.fillRect(0, 0, w, h / 2);
            fctx.fillStyle = '#ffd700'; fctx.fillRect(0, h / 2, w, h / 2);
            break;
        case 'ru': // Russia
            fctx.fillStyle = '#ffffff'; fctx.fillRect(0, 0, w, h / 3);
            fctx.fillStyle = '#0039a6'; fctx.fillRect(0, h / 3, w, h / 3);
            fctx.fillStyle = '#d52b1e'; fctx.fillRect(0, 2 * h / 3, w, h / 3);
            break;
        case 'de': // Germany
            fctx.fillStyle = '#000000'; fctx.fillRect(0, 0, w, h / 3);
            fctx.fillStyle = '#dd0000'; fctx.fillRect(0, h / 3, w, h / 3);
            fctx.fillStyle = '#ffce00'; fctx.fillRect(0, 2 * h / 3, w, h / 3);
            break;
        case 'fr': // France
            fctx.fillStyle = '#0055a4'; fctx.fillRect(0, 0, w / 3, h);
            fctx.fillStyle = '#ffffff'; fctx.fillRect(w / 3, 0, w / 3, h);
            fctx.fillStyle = '#ef4135'; fctx.fillRect(2 * w / 3, 0, w / 3, h);
            break;
        case 'es': // Spain
            fctx.fillStyle = '#aa151b'; fctx.fillRect(0, 0, w, h * 0.25);
            fctx.fillStyle = '#f1bf00'; fctx.fillRect(0, h * 0.25, w, h * 0.5);
            fctx.fillStyle = '#aa151b'; fctx.fillRect(0, h * 0.75, w, h * 0.25);
            break;
        case 'it': // Italy
            fctx.fillStyle = '#009246'; fctx.fillRect(0, 0, w / 3, h);
            fctx.fillStyle = '#ffffff'; fctx.fillRect(w / 3, 0, w / 3, h);
            fctx.fillStyle = '#ce2b37'; fctx.fillRect(2 * w / 3, 0, w / 3, h);
            break;
        case 'pt': // Portugal (simplified)
            fctx.fillStyle = '#006600'; fctx.fillRect(0, 0, w * 0.4, h);
            fctx.fillStyle = '#ff0000'; fctx.fillRect(w * 0.4, 0, w * 0.6, h);
            break;
        case 'nl': // Netherlands
            fctx.fillStyle = '#ae1c28'; fctx.fillRect(0, 0, w, h / 3);
            fctx.fillStyle = '#ffffff'; fctx.fillRect(0, h / 3, w, h / 3);
            fctx.fillStyle = '#21468b'; fctx.fillRect(0, 2 * h / 3, w, h / 3);
            break;
        case 'zh': // China (simplified)
            fctx.fillStyle = '#de2910'; fctx.fillRect(0, 0, w, h);
            drawSimpleStar(fctx, w * 0.24, h * 0.32, h * 0.26, '#ffde00');
            break;
        default:
            fctx.fillStyle = '#334155'; fctx.fillRect(0, 0, w, h);
    }
    fctx.strokeStyle = 'rgba(0,0,0,0.5)';
    fctx.lineWidth = 1;
    fctx.strokeRect(0.5, 0.5, w - 1, h - 1);
}

        const flagCanvas = document.createElement('canvas');
        flagCanvas.width = 20;
        flagCanvas.height = 14;
        flagCanvas.className = 'lang-flag-canvas';
        opt.appendChild(flagCanvas);

            localStorage.setItem('frog_lang', code);
            applyLanguage();
            buildLangGrid();
        });

        drawFlagIcon(code, flagCanvas);
    });
}

    if (coins >= skin.price && !ownedSkins.includes(skin.id)) {
        coins -= skin.price;
        localStorage.setItem('frog_coins', coins);
        ownedSkins.push(skin.id);
        equippedSkinId = skin.id;

        playCoinSound();

function playJumpSound() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = 'square';
    osc.frequency.setValueAtTime(150, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.15);

    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + 0.15);
}

function startBgMusic() {
    if (bgMusicInterval) clearInterval(bgMusicInterval);
    if (!isMusicEnabled) return;

    const melody = [
        261.63, 329.63, 392.00, 523.25,
        293.66, 349.23, 440.00, 587.33,
        329.63, 392.00, 493.88, 659.25,
        349.23, 440.00, 523.25, 698.46
    ];

    bgMusicInterval = setInterval(() => {
        if (!audioCtx || gameOver || !isMusicEnabled) return;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        let freq = melody[musicStep % melody.length];

        osc.type = 'square';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

        gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);

        musicStep++;
    }, 140);
}

function stopBgMusic() {
    if (bgMusicInterval) {
        clearInterval(bgMusicInterval);
        bgMusicInterval = null;
    }
}

// ==================== AD PLACEHOLDER ====================
// Adsgram Rewarded SDK подключён (см. <script src="sad.min.js"> в <head>).
// AdController создаётся один раз через window.Adsgram.init({ blockId }),
// а showAdPlaceholder() вызывает AdController.show() и решает
// resolve/reject по тому, досмотрел ли игрок ролик до конца
// (result.done). Вся остальная логика (кнопки, кулдауны, награды)
// не тронута — она как была завязана на showAdPlaceholder(name).

// TODO: если у тебя несколько разных рекламных юнитов (например, свой
// blockId под ревард-скин и отдельный под ревард-жизнь), замени на
// несколько AdController'ов и выбирай нужный внутри showAdPlaceholder(name).
const ADSGRAM_BLOCK_ID = '48755';
let AdController = null;
try {
    if (window.Adsgram) {
        AdController = window.Adsgram.init({ blockId: ADSGRAM_BLOCK_ID });
    }
} catch (e) {
    console.warn('Adsgram init failed:', e);
}

// Отдельный блок под межстраничную (Interstitial) рекламу — другой
// UnitID (int-48763) в кабинете Adsgram, отдельный AdController.
// В отличие от ревард-рекламы, интерстишл не обязывает нас проверять,
// досмотрел ли игрок ролик до конца — по формату его можно закрыть
// раньше, и это не ошибка.
const INTERSTITIAL_BLOCK_ID = 'int-48763';
let InterstitialAdController = null;
try {
    if (window.Adsgram) {
        InterstitialAdController = window.Adsgram.init({ blockId: INTERSTITIAL_BLOCK_ID });
    }
} catch (e) {
    console.warn('Adsgram interstitial init failed:', e);
}

let wasMusicPlayingBeforeAd = false;

// Отдельный флаг "идёт показ рекламы" — НЕ путать с isPaused (меню паузы).
// adPlaying блокирует физику и ввод сам по себе, не трогая
// isPaused/shopOpen, так что после рекламы игра возвращается ровно
// в то состояние, в котором была до её показа.
let adPlaying = false;

function pauseForAd() {
    wasMusicPlayingBeforeAd = !!bgMusicInterval;
    stopBgMusic();
    // suspend() глушит ВЕСЬ звук из AudioContext разом — и музыку,
    // и любые звуковые эффекты (прыжок, монетка и т.д.), которые могли
    // сработать прямо в момент показа рекламы.
    if (audioCtx && audioCtx.state === 'running') {
        audioCtx.suspend();
    }
    adPlaying = true;
}
function resumeFromAd() {
    adPlaying = false;
    // Рекламные SDK обычно показывают ролик в iframe и забирают фокус
    // клавиатуры себе. Если после его закрытия не вернуть фокус странице,
    // клавиши стрелок/A-D перестают долетать до
    // window.addEventListener('keydown', ...), и управление "оживает"
    // только после клика по экрану.
    window.focus();
    if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
    if (wasMusicPlayingBeforeAd && isMusicEnabled) startBgMusic();
}

// Показ реального ревард-ролика через Adsgram. resolve() только если
// пользователь досмотрел рекламу до конца (result.done === true) —
// именно так вызовы ниже (revive/skin/coins) решают, выдавать награду
// или нет. Если SDK не инициализировался (например, открыли файл не
// внутри Telegram mini app) — reject сразу, награду не даём.
function showAdPlaceholder(name) {
    return new Promise((resolve, reject) => {
        if (!AdController) {
            console.warn('Adsgram AdController не инициализирован, показ рекламы недоступен:', name);
            reject(false);
            return;
        }
        pauseForAd();
        AdController.show().then((result) => {
            resumeFromAd();
            if (result && result.done) {
                resolve(true);
            } else {
                reject(false);
            }
        }).catch((result) => {
            resumeFromAd();
            reject(result);
        });
    });
}

// Показ интерстишл-ролика. В отличие от ревард-рекламы её можно
// закрыть раньше — это нормальный исход, а не "отказ", поэтому здесь
// нет reject по недосмотру: resolve() вызывается в любом случае после
// закрытия/окончания ролика (или сразу, если реклама недоступна), а
// вызывающий код просто продолжает своё дело (например, рестарт игры).
function showInterstitialAd(name) {
    return new Promise((resolve) => {
        if (!InterstitialAdController) {
            console.warn('Adsgram InterstitialAdController не инициализирован, показ рекламы недоступен:', name);
            resolve(false);
            return;
        }
        pauseForAd();
        InterstitialAdController.show().then(() => {
            resumeFromAd();
            resolve(true);
        }).catch(() => {
            resumeFromAd();
            resolve(false);
        });
    });
}

// --- 1) INTERSTITIAL: не чаще, чем раз в 2.5 минуты, и строго не во
// время прыжков/полёта — реклама может сработать только в двух
// "спокойных" точках: по клику на кнопку RESTART на экране смерти,
// либо если игрок завис в магазине без действий 2.5 минуты (AFK).
//
// Важно: кулдаун проверяется именно в момент клика/срабатывания
// AFK-таймера, а НЕ в момент смерти. Если игрок погиб на 2:31, но
// кулдаун истёк ещё на 2:30 — реклама не выскакивает сама по себе
// сразу после смерти; она покажется только когда он реально нажмёт
// RESTART (см. restartBtn.addEventListener ниже). Если игрок жмёт
// RESTART раньше, чем истекли 2.5 минуты — рестарт происходит сразу,
// без рекламы.
const INTERSTITIAL_AD_COOLDOWN_MS = 2.5 * 60 * 1000;
let lastInterstitialAdTime = Date.now();
let interstitialAdInFlight = false;
let shopAfkTimer = null;

// onDone вызывается всегда: сразу — если кулдаун ещё не истёк (реклама
// не показывается вовсе), либо после того, как ролик закрылся/закончился.
function tryShowInterstitialAd(onDone) {
    const now = Date.now();
    if (interstitialAdInFlight || now - lastInterstitialAdTime < INTERSTITIAL_AD_COOLDOWN_MS) {
        if (typeof onDone === 'function') onDone();
        return;
    }
    interstitialAdInFlight = true;
    lastInterstitialAdTime = now;
    showInterstitialAd('interstitial-ad').then(() => {
        interstitialAdInFlight = false;
        if (typeof onDone === 'function') onDone();
    });
}

// --- 2) REWARDED: возрождение на экране смерти (максимум 3 раза за забег) ---
const MAX_REVIVES_PER_RUN = 3;
let reviveCount = 0;

function updateReviveButtonUI() {
    if (reviveCount >= MAX_REVIVES_PER_RUN) {
        reviveBtn.classList.add('hidden');
    } else {
        reviveBtn.classList.remove('hidden');
        reviveCountEl.innerText = `(${reviveCount}/${MAX_REVIVES_PER_RUN})`;
    }
}

function doRevive() {
    reviveCount++;
    gameOver = false;
    gameOverScreen.classList.remove('active');

    // Возрождаем жабку на самой верхней из уцелевших платформ
    let topPad = platforms[0];
    platforms.forEach(p => { if (p.y < topPad.y) topPad = p; });
    frog.x = topPad.x + topPad.width / 2 - frog.width / 2;
    frog.y = topPad.y - frog.height - 2;
    frog.vy = frog.jumpForce;
    frog.vx = 0;
    frog.squashTimer = 6;

    updateReviveButtonUI();

    // "3... 2... 1... JUMP!" перед тем как отпустить физику — та же
    // анимация, что и при снятии с паузы (см. runCountdownAnimation()),
    // чтобы игрок не падал/не прыгал вслепую в первую же секунду после
    // рекламного ролика.
    runCountdownAnimation(() => {});
}

reviveBtn.addEventListener('click', () => {
    showAdPlaceholder('revive-ad').then(() => {
        // Реклама досмотрена полностью — выдаём награду
        doRevive();
    }).catch(() => {
        // Реклама пропущена/недоступна — награду не даём
    });
});

// --- 3) REWARDED: получить скин бесплатно за рекламу (альтернатива монетам) ---
function watchAdForSkin(skin) {
    showAdPlaceholder('skin-unlock-ad').then(() => {
        if (!ownedSkins.includes(skin.id)) ownedSkins.push(skin.id);
        equippedSkinId = skin.id;
        saveSkinState();
        playCoinSound();
        buildShopGrid();

    });
}

// --- 4) REWARDED: +10 монет за рекламу в меню паузы (перезарядка 10 минут) ---
const PAUSE_COIN_REWARD = 10;
const PAUSE_COIN_AD_COOLDOWN_MS = 10 * 60 * 1000;
let lastPauseCoinAdTime = 0;
let pauseCoinTimerInterval = null;

function updatePauseCoinBtn() {
    const remaining = PAUSE_COIN_AD_COOLDOWN_MS - (Date.now() - lastPauseCoinAdTime);
    if (remaining <= 0) {
        pauseCoinBtn.disabled = false;
        pauseCoinBtn.classList.remove('on-cooldown');
        pauseCoinBtn.innerText = `+${PAUSE_COIN_REWARD} COINS (AD)`;
    } else {
        pauseCoinBtn.disabled = true;
        pauseCoinBtn.classList.add('on-cooldown');
        const totalSec = Math.ceil(remaining / 1000);
        const mm = Math.floor(totalSec / 60);
        const ss = totalSec % 60;
        pauseCoinBtn.innerText = `AVAILABLE IN ${mm}:${ss.toString().padStart(2, '0')}`;
    }
}

pauseCoinBtn.addEventListener('click', () => {
    if (Date.now() - lastPauseCoinAdTime < PAUSE_COIN_AD_COOLDOWN_MS) return;
    showAdPlaceholder('pause-coin-ad').then(() => {
        coins += PAUSE_COIN_REWARD;
        localStorage.setItem('frog_coins', coins);
        lastPauseCoinAdTime = Date.now();
        playCoinSound();
        updatePauseCoinBtn();
    }).catch(() => {
        // Реклама пропущена/недоступна — монеты не начисляем
    });
});
