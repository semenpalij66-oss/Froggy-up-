function pseudoRandom(seed) {
    let x = Math.sin(seed) * 10000;
    return x - Math.floor(x);
}

function initFireflies() {
    fireflies = [];
    for (let i = 0; i < 10; i++) {
        fireflies.push({
            x: Math.random() < 0.5 ? Math.random() * (BANK_WIDTH - 15) : canvas.width - BANK_WIDTH + Math.random() * (BANK_WIDTH - 15),
            y: Math.random() * canvas.height,
            size: Math.random() * 2 + 1,
            speedX: (Math.random() - 0.5) * 0.4,
            speedY: (Math.random() - 0.5) * 0.4,
            pulse: Math.random() * Math.PI * 2
        });
    }
}

function drawFrogCoin(cx, cy, size = 14, targetCtx = ctx) {
    const c = targetCtx;
    c.save();
    c.translate(cx, cy);

    const r = size / 2;

    c.fillStyle = '#b45309';
    c.fillRect(-r, -r, size, size);

    c.fillStyle = '#fbbf24';
    c.fillRect(-r + 1, -r + 1, size - 2, size - 2);

    c.fillStyle = '#fef08a';
    c.fillRect(-r + 2, -r + 2, size/4, size/4);

    c.fillStyle = '#15803d';
    c.fillRect(-r + size/5, -r + size/3, size - (size/5)*2, size - (size/3)*2);

    c.fillStyle = '#ffffff';
    c.fillRect(-r + size/4, -r + size/4, size/6, size/6);
    c.fillRect(r - size/3, -r + size/4, size/6, size/6);

    c.fillStyle = '#000';
    c.fillRect(-r + size/4, -r + size/4, 1, 1);
    c.fillRect(r - size/3, -r + size/4, 1, 1);

    c.restore();
}

// Мухоморовая пружина (26x16px)
function drawPixelAmanitaSpring(x, y, isCompressed) {
    ctx.save();
    ctx.translate(Math.round(x), Math.round(y));

    if (isCompressed) {
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(2, 13, 22, 3);

        ctx.fillStyle = '#64748b';
        ctx.fillRect(4, 10, 18, 3);
        ctx.fillStyle = '#f8fafc';
        ctx.fillRect(6, 11, 14, 1);

        ctx.fillStyle = '#7f1d1d';
        ctx.fillRect(1, 8, 24, 3);
        ctx.fillStyle = '#dc2626';
        ctx.fillRect(2, 5, 22, 4);

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(4, 6, 4, 2);
        ctx.fillRect(11, 5, 4, 2);
        ctx.fillRect(18, 6, 4, 2);
    } else {
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(2, 14, 22, 2);

        ctx.fillStyle = '#334155';
        ctx.fillRect(5, 7, 16, 7);

        ctx.fillStyle = '#cbd5e1';
        ctx.fillRect(6, 7, 14, 2);
        ctx.fillRect(6, 10, 14, 2);
        ctx.fillRect(6, 13, 14, 1);

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(8, 7, 4, 1);
        ctx.fillRect(8, 10, 4, 1);

        ctx.fillStyle = '#7f1d1d';
        ctx.fillRect(0, 6, 26, 2);

        ctx.fillStyle = '#dc2626';
        ctx.fillRect(1, 2, 24, 5);
        ctx.fillRect(3, 0, 20, 2);

        ctx.fillStyle = '#ef4444';
        ctx.fillRect(4, 1, 6, 2);

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(4, 3, 4, 2);
        ctx.fillRect(11, 1, 4, 2);
        ctx.fillRect(18, 3, 4, 2);
    }

    ctx.restore();
}

// --- ПИКСЕЛЬ-АРТ ЛОТОС-БАТУТ (34x18px) ---
function drawPixelLotusTrampoline(x, y, isCompressed) {
    ctx.save();
    ctx.translate(Math.round(x), Math.round(y));

    // Тень под лотосом
    ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
    ctx.fillRect(3, 15, 28, 3);

    // Защитный кувшинковый лист-основание
    ctx.fillStyle = '#047857';
    ctx.fillRect(2, 13, 30, 4);
    ctx.fillStyle = '#10b981';
    ctx.fillRect(4, 14, 26, 2);

    if (isCompressed) {
        // --- СЖАТЫЙ СОСТОЯНИЕ (ПРИЗЕМЛЕНИЕ) ---
        // Зелёный упругий стебель-пружина
        ctx.fillStyle = '#065f46';
        ctx.fillRect(14, 11, 6, 3);
        ctx.fillStyle = '#34d399';
        ctx.fillRect(16, 11, 2, 3);

        // Внешние розовые лепестки (согнутые книзу)
        ctx.fillStyle = '#9d174d';
        ctx.fillRect(1, 10, 32, 4);
        ctx.fillStyle = '#be185d';
        ctx.fillRect(3, 8, 28, 4);
        ctx.fillStyle = '#f43f5e';
        ctx.fillRect(5, 7, 24, 3);

        // Яркая пружинистая золотая пыльца (сжата)
        ctx.fillStyle = '#f59e0b';
        ctx.fillRect(9, 8, 16, 2);
        ctx.fillStyle = '#fef08a';
        ctx.fillRect(12, 8, 10, 1);

    } else {
        // --- ОБЫЧНОЕ СОСТОЯНИЕ (ПОКОЙ И СВЕЧЕНИЕ) ---
        // Зелёный пружинный стебель
        ctx.fillStyle = '#065f46';
        ctx.fillRect(13, 10, 8, 4);
        ctx.fillStyle = '#34d399';
        ctx.fillRect(15, 10, 4, 4);

        // Нижний слой лепестков (тёмно-розовый контур)
        ctx.fillStyle = '#831843';
        ctx.fillRect(0, 6, 34, 6);
        ctx.fillRect(3, 3, 28, 4);

        // Основной насыщенный розовый бутон
        ctx.fillStyle = '#db2777';
        ctx.fillRect(2, 5, 30, 6);
        ctx.fillRect(5, 2, 24, 4);

        // Светлые блики на кончиках лепестков
        ctx.fillStyle = '#f472b6';
        ctx.fillRect(1, 5, 3, 4);
        ctx.fillRect(30, 5, 3, 4);
        ctx.fillRect(6, 1, 4, 3);
        ctx.fillRect(24, 1, 4, 3);
        ctx.fillRect(13, 0, 8, 2);

        // ПЫЛЬЦА / СЕРДЦЕВИНА БАТУТА (Энергетическая золотая площадка)
        ctx.fillStyle = '#d97706';
        ctx.fillRect(8, 4, 18, 4);
        ctx.fillStyle = '#fbbf24';
        ctx.fillRect(10, 3, 14, 4);
        
        // Переливающийся блик на пыльце (сигнал игроку прыгать сюда)
        const glow = Math.sin(Date.now() * 0.01) > 0 ? '#ffffff' : '#fef08a';
        ctx.fillStyle = glow;
        ctx.fillRect(12, 4, 10, 2);
    }

    ctx.restore();
}

function drawPixelArtFrog(x, y, facing, vy, squashTimer, isIdle = false, targetCtx = ctx, palette = null, staticPose = false) {
    const c = targetCtx;
    const pal = palette || getCurrentPalette();
    c.save();

    let scaleY, scaleX;
    if (staticPose) {
        scaleY = 1;
        scaleX = 1;
    } else {
        let targetScaleY = 1;
        if (squashTimer > 0) {
            targetScaleY = 0.8;
        } else if (vy < -3) {
            targetScaleY = 1.15;
        } else if (vy > 3) {
            targetScaleY = 0.92;
        } else if (isIdle || isWaitingForSpace) {
            targetScaleY = 1 + Math.sin(Date.now() * 0.004) * 0.05;
        }

        frog.currentScaleY += (targetScaleY - frog.currentScaleY) * 0.25;
        scaleY = frog.currentScaleY;
        scaleX = 1 / scaleY;
    }

    const centerX = Math.round(x) + frog.width / 2;
    const bottomY = Math.round(y) + frog.height;

    c.translate(centerX, bottomY);

    if (facing === 'left') {
        c.scale(-scaleX, scaleY);
    } else {
        c.scale(scaleX, scaleY);
    }

    const drawX = -frog.width / 2;
    const drawY = -frog.height;

    c.fillStyle = 'rgba(0, 20, 10, 0.3)';
    c.fillRect(drawX + 2, drawY + frog.height - 2, 24, 2);

    let legOffset = (!staticPose && vy < 0 && !isIdle) ? -1 : 0;
    c.fillStyle = pal.legs;
    c.fillRect(drawX, drawY + 14 + legOffset, 8, 10);
    c.fillRect(drawX + 20, drawY + 14 + legOffset, 8, 10);

    c.fillStyle = pal.bodyOuter;
    c.fillRect(drawX + 4, drawY + 4, 20, 18);
    c.fillRect(drawX + 2, drawY + 8, 24, 12);

    c.fillStyle = pal.bodyInner;
    c.fillRect(drawX + 8, drawY + 10, 12, 10);

    c.fillStyle = pal.head;
    c.fillRect(drawX + 4, drawY, 8, 6);
    c.fillRect(drawX + 16, drawY, 8, 6);

    let isBlinking = false;
    if (!staticPose) {
        blinkTimer++;
        isBlinking = isIdle && (blinkTimer % 180 > 170);
    }

    if (!isBlinking) {
        let eyeY = (!staticPose && vy < -2 && !isIdle) ? -1 : ((!staticPose && vy > 2 && !isIdle) ? 1 : 0);
        c.fillStyle = '#000000';
        c.fillRect(drawX + 8, drawY + 2 + eyeY, 3, 3);
        c.fillRect(drawX + 17, drawY + 2 + eyeY, 3, 3);
    } else {
        c.fillStyle = pal.legs;
        c.fillRect(drawX + 7, drawY + 3, 5, 2);
        c.fillRect(drawX + 16, drawY + 3, 5, 2);
    }

    c.fillStyle = pal.spots;
    c.fillRect(drawX + 6, drawY + 12, 2, 2);
    c.fillRect(drawX + 20, drawY + 12, 2, 2);

    c.restore();
}

function drawPixelPad(pad) {
    const rx = Math.round(pad.x);
    const ry = Math.round(pad.y - cameraY);

    if (pad.broken) return;

    ctx.fillStyle = 'rgba(0, 15, 30, 0.4)';
    ctx.fillRect(rx + 2, ry + pad.height, pad.width - 4, 3);

    let baseColor = '#15803d';
    let lightColor = '#22c55e';
    let darkColor = '#0d5c2b';

    if (pad.type === 'moving') {
        baseColor = '#0284c7';
        lightColor = '#38bdf8';
        darkColor = '#0369a1';
    } else if (pad.type === 'broken') {
        baseColor = '#854d0e';
        lightColor = '#ca8a04';
        darkColor = '#533107';
    }

    ctx.fillStyle = darkColor;
    ctx.fillRect(rx, ry, pad.width, pad.height);
    ctx.fillStyle = baseColor;
    ctx.fillRect(rx + 2, ry + 2, pad.width - 4, pad.height - 4);
    ctx.fillStyle = lightColor;
    ctx.fillRect(rx + 4, ry + 2, pad.width - 8, 2);

    if (pad.hasFlower && !pad.hasSpring && !pad.hasTrampoline) {
        ctx.fillStyle = '#ff4d6d';
        ctx.fillRect(rx + 6, ry - 5, 6, 6);
        ctx.fillStyle = '#fff';
        ctx.fillRect(rx + 8, ry - 3, 2, 2);
    }

    if (pad.type === 'broken') {
        ctx.fillStyle = '#301802';
        ctx.fillRect(rx + 12, ry + 2, 2, 8);
        ctx.fillRect(rx + 22, ry + 4, 2, 6);
    }

    if (pad.hasSpring) {
        let springX = rx + pad.springOffsetX;
        let springY = ry - 16;
        drawPixelAmanitaSpring(springX, springY, pad.springCompressedTimer > 0);
    }

    if (pad.hasTrampoline) {
        let trampX = rx + pad.trampolineOffsetX;
        let trampY = ry - 18;
        drawPixelLotusTrampoline(trampX, trampY, pad.trampolineCompressedTimer > 0);
    }

    if (pad.hasCoin) {
        drawFrogCoin(rx + pad.width / 2, ry - 14, 14);
    }
}

function createPad(y, type = 'normal', forceCoin = false, forceSpring = false, forceTrampoline = false) {
    const width = 52; 
    const height = 12;
    const minX = BANK_WIDTH + 10;
    const maxX = canvas.width - BANK_WIDTH - width - 10;
    const x = Math.random() * (maxX - minX) + minX;

    const hasFlower = Math.random() > 0.6 && type !== 'broken';

    const hasTrampoline = !forceCoin && type !== 'broken' && (forceTrampoline || Math.random() < 0.02);
    const hasSpring = !forceCoin && !hasTrampoline && type !== 'broken' && (forceSpring || Math.random() < 0.08);
    
    const springWidth = 26;
    const springOffsetX = Math.floor((width - springWidth) / 2);

    const trampolineWidth = 34;
    const trampolineOffsetX = Math.floor((width - trampolineWidth) / 2);

    return { 
        x, 
        y, 
        width, 
        height, 
        type, 
        vx: type === 'moving' ? (Math.random() > 0.5 ? 1.8 : -1.8) : 0, 
        hasFlower, 
        broken: false,
        hasCoin: forceCoin,
        hasSpring: hasSpring,
        springOffsetX: springOffsetX,
        springCompressedTimer: 0,
        hasTrampoline: hasTrampoline,
        trampolineOffsetX: trampolineOffsetX,
        trampolineCompressedTimer: 0
    };
}

function initGame() {
    score = 0;
    nextCoinScore = 500;
    nextSpringScore = 800;
    nextTrampolineScore = 2500;
    cameraY = 0;
    gameOver = false;
    reviveCount = 0;
    updateReviveButtonUI();
    scoreEl.innerText = `${t('score')}: 0`;
    gameOverScreen.classList.remove('active');

    if (document.activeElement) {
        document.activeElement.blur();
    }

    platforms = [
        { x: 160, y: 510, width: 80, height: 14, type: 'normal', vx: 0, hasFlower: true, broken: false, hasCoin: false, hasSpring: false, springOffsetX: 0, springCompressedTimer: 0, hasTrampoline: false, trampolineOffsetX: 0, trampolineCompressedTimer: 0 }
    ];

    frog.x = 186;
    frog.y = 484;
    frog.vx = 0;
    frog.vy = 0;
    frog.squashTimer = 0;
    frog.currentScaleY = 1;

    for (let i = 0; i < 8; i++) {
        let y = 430 - (i * 70); 
        let type = 'normal';
        let r = Math.random();
        if (i > 2) {
            if (r < 0.35) type = 'moving';
            else if (r < 0.50) type = 'broken'; 
        }
        platforms.push(createPad(y, type, false, false, false));
    }

    particles = [];
    initFireflies();

    isWaitingForSpace = true;
}

function goToMainMenu() {
    gameStarted = false;
    gameOver = false;
    isPaused = false;
    isCountingDown = false;
    pauseOverlay.classList.remove('active');
    countdownOverlay.classList.remove('active');
    mainMenu.classList.remove('hidden');
    gameOverScreen.classList.remove('active');
    if (pauseCoinTimerInterval) {
        clearInterval(pauseCoinTimerInterval);
        pauseCoinTimerInterval = null;
    }
}

function openPause() {
    isPaused = true;
    pauseTitleEl.innerText = t('pause');
    pauseResumeBtn.innerText = t('resume');

    const pctx = pauseFrogCanvas.getContext('2d');
    pctx.imageSmoothingEnabled = false;
    pctx.clearRect(0, 0, pauseFrogCanvas.width, pauseFrogCanvas.height);
    pctx.save();
    const zoom = 1.8;
    pctx.scale(zoom, zoom);
    const availSize = pauseFrogCanvas.width / zoom;
    const fx = (availSize - frog.width) / 2;
    const fy = (availSize - frog.height) / 2;
    drawPixelArtFrog(fx, fy, 'right', 0, 0, false, pctx, getCurrentPalette(), true);
    pctx.restore();

    pauseOverlay.classList.add('active');

    // Показываем и обновляем раз в секунду кнопку "+10 монет за рекламу"
    updatePauseCoinBtn();
    if (pauseCoinTimerInterval) clearInterval(pauseCoinTimerInterval);
    pauseCoinTimerInterval = setInterval(updatePauseCoinBtn, 1000);
}

function closePause() {
    pauseOverlay.classList.remove('active');
    if (pauseCoinTimerInterval) {
        clearInterval(pauseCoinTimerInterval);
        pauseCoinTimerInterval = null;
    }
}

// Общая анимация "3... 2... 1... JUMP!" — используется и при снятии с
// паузы, и при возрождении по рекламе. onComplete вызывается сразу после
// того, как оверлей спрятан и isCountingDown снова false (т.е. физика/
// управление уже разблокированы).
function runCountdownAnimation(onComplete) {
    isCountingDown = true;
    countdownOverlay.classList.add('active');
    const steps = ['3', '2', '1', t('jumpExclaim')];
    let i = 0;

    function showStep() {
        countdownTextEl.innerText = steps[i];
        countdownTextEl.style.animation = 'none';
        void countdownTextEl.offsetWidth;
        countdownTextEl.style.animation = '';
        i++;
        if (i < steps.length) {
            setTimeout(showStep, 700);
        } else {
            setTimeout(() => {
                countdownOverlay.classList.remove('active');
                isCountingDown = false;
                onComplete();
            }, 700);
        }
    }
    showStep();
}

function startCountdown() {
    closePause();
    runCountdownAnimation(() => { isPaused = false; });
}

pauseResumeBtn.addEventListener('click', () => { startCountdown(); });

function launchFrog() {
    if (isWaitingForSpace) {
        isWaitingForSpace = false;
        frog.vy = frog.jumpForce;
        playJumpSound();
    }
}

function update() {
    if (gameOver || !gameStarted || shopOpen || isPaused || isCountingDown || adPlaying) return;

    platforms.forEach(pad => {
        if (pad.type === 'moving') {
            pad.x += pad.vx;
            if (pad.x <= BANK_WIDTH + 5 || pad.x + pad.width >= canvas.width - BANK_WIDTH - 5) {
                pad.vx *= -1;
            }
        }
        if (pad.springCompressedTimer > 0) pad.springCompressedTimer--;
        if (pad.trampolineCompressedTimer > 0) pad.trampolineCompressedTimer--;
    });

    if (isWaitingForSpace) return;

    if (keys.left) {
        frog.vx -= frog.speed;
        frog.facing = 'left';
    }
    if (keys.right) {
        frog.vx += frog.speed;
        frog.facing = 'right';
    }

    frog.vx *= frog.friction;
    frog.x += frog.vx;
    frog.vy += frog.gravity;
    frog.y += frog.vy;

    if (frog.squashTimer > 0) frog.squashTimer--;

    if (frog.x < BANK_WIDTH) {
        frog.x = BANK_WIDTH;
        frog.vx = 0;
    }
    if (frog.x + frog.width > canvas.width - BANK_WIDTH) {
        frog.x = canvas.width - BANK_WIDTH - frog.width;
        frog.vx = 0;
    }

    if (frog.y - cameraY < 250) {
        let diff = 250 - (frog.y - cameraY);
        cameraY -= diff;
        score += Math.floor(diff);
        if (score > highScore) {
            highScore = score;
            localStorage.setItem('frog_jump_high', highScore);
            highScoreEl.innerText = `${t('best')}: ${highScore}`;
        }
        scoreEl.innerText = `${t('score')}: ${score}`;
    }

    let topPadY = platforms.reduce((min, p) => p.y < min ? p.y : min, canvas.height);
    if (topPadY - cameraY > -50) {
        let newY = topPadY - (Math.random() * 30 + 65);
        let type = 'normal';
        let r = Math.random();
        if (r < 0.4) type = 'moving';
        else if (r < 0.65) type = 'broken';

        let shouldHaveCoin = false;
        if (score >= nextCoinScore && type !== 'broken') {
            shouldHaveCoin = true;
            nextCoinScore += 500;
        }

        let shouldHaveTrampoline = false;
        if (score >= nextTrampolineScore && type !== 'broken' && !shouldHaveCoin) {
            shouldHaveTrampoline = true;
            nextTrampolineScore += 2500;
        }

        let shouldHaveSpring = false;
        if (score >= nextSpringScore && type !== 'broken' && !shouldHaveCoin && !shouldHaveTrampoline) {
            shouldHaveSpring = true;
            nextSpringScore += 800;
        }

        platforms.push(createPad(newY, type, shouldHaveCoin, shouldHaveSpring, shouldHaveTrampoline));
    }

    platforms.forEach(pad => {
        if (pad.hasCoin) {
            let coinX = pad.x + pad.width / 2;
            let coinY = pad.y - 14;
            let dist = Math.hypot((frog.x + frog.width / 2) - coinX, (frog.y + frog.height / 2) - coinY);

            if (dist < 22) {
                pad.hasCoin = false;
                coins++;
                localStorage.setItem('frog_coins', coins);
                playCoinSound();

                for (let i = 0; i < 8; i++) {
                    particles.push({
                        x: coinX,
                        y: coinY,
                        vx: (Math.random() - 0.5) * 3.5,
                        vy: -Math.random() * 3.5,
                        size: 3,
                        color: '#fbbf24',
                        life: 14
                    });
                }
            }
        }

        if (frog.vy > 0 && 
            frog.x + frog.width - 6 > pad.x && 
            frog.x + 6 < pad.x + pad.width &&
            frog.y + frog.height >= pad.y &&
            frog.y + frog.height <= pad.y + pad.height + 6) {

            if (!pad.broken) {
                let hitTrampoline = false;
                let hitSpring = false;

                if (pad.hasTrampoline) {
                    let trX = pad.x + pad.trampolineOffsetX;
                    let trW = 34;
                    if (frog.x + frog.width > trX && frog.x < trX + trW) {
                        hitTrampoline = true;
                    }
                } else if (pad.hasSpring) {
                    let spX = pad.x + pad.springOffsetX;
                    let spW = 26;
                    if (frog.x + frog.width > spX && frog.x < spX + spW) {
                        hitSpring = true;
                    }
                }

                if (hitTrampoline) {
                    frog.vy = frog.trampolineForce;
                    pad.trampolineCompressedTimer = 12;
                    playTrampolineSound();

                    // Лепестковые пыльцевые частицы при супер-прыжке
                    for (let i = 0; i < 18; i++) {
                        particles.push({
                            x: frog.x + frog.width / 2,
                            y: frog.y + frog.height,
                            vx: (Math.random() - 0.5) * 8,
                            vy: -Math.random() * 7,
                            size: Math.random() * 4 + 2,
                            color: Math.random() > 0.5 ? '#f472b6' : '#fef08a',
                            life: 26
                        });
                    }
                } else if (hitSpring) {
                    frog.vy = frog.springForce;
                    pad.springCompressedTimer = 10;
                    playSpringSound();

                    for (let i = 0; i < 12; i++) {
                        particles.push({
                            x: frog.x + frog.width / 2,
                            y: frog.y + frog.height,
                            vx: (Math.random() - 0.5) * 6,
                            vy: -Math.random() * 5,
                            size: Math.random() * 4 + 2,
                            color: Math.random() > 0.4 ? '#dc2626' : '#ffffff',
                            life: 20
                        });
                    }
                } else {
                    frog.vy = frog.jumpForce;
                    if (pad.type === 'broken') {
                        pad.broken = true;
                        playBreakSound();
                    } else {
                        playJumpSound();
                    }

                    let landPalette = getCurrentPalette();
                    for (let i = 0; i < 10; i++) {
                        particles.push({
                            x: frog.x + frog.width / 2,
                            y: frog.y + frog.height,
                            vx: (Math.random() - 0.5) * 4.5,
                            vy: -Math.random() * 3.5,
                            size: Math.random() * 4 + 2.5,
                            color: Math.random() > 0.5 ? landPalette.bodyOuter : landPalette.bodyInner,
                            life: 18
                        });
                    }
                }

                frog.squashTimer = 6;
            }
        }
    });

    platforms = platforms.filter(p => p.y - cameraY < canvas.height + 50);

    fireflies.forEach(f => {
        f.x += f.speedX;
        f.y += f.speedY;
        f.pulse += 0.05;

        if (f.x < 0) f.x = BANK_WIDTH - 10;
        if (f.x > BANK_WIDTH && f.x < canvas.width - BANK_WIDTH) f.x = canvas.width - 10;
        if (f.y < 0) f.y = canvas.height;
        if (f.y > canvas.height) f.y = 0;
    });

    particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
    });
    particles = particles.filter(p => p.life > 0);

    if (frog.y - cameraY > canvas.height + 40) {
        gameOver = true;
        playFallSound();
        finalScoreEl.innerText = `${t('score')}: ${score}`;
        gameOverScreen.classList.add('active');
        updateReviveButtonUI();
        // Интерстишл-реклама здесь НЕ показывается: экран смерти сам по
        // себе не триггерит рекламу, даже если кулдаун уже истёк.
        // Показ (если кулдаун истёк) происходит только по клику на
        // RESTART — см. restartBtn.addEventListener ниже.
    }
}

function drawRoundedBox(x, y, w, h, bg = '#fde68a', border = '#78350f') {
    ctx.save();
    ctx.fillStyle = border;
    ctx.fillRect(x + 3, y, w - 6, h);
    ctx.fillRect(x, y + 3, w, h - 6);
    ctx.fillRect(x + 1, y + 1, w - 2, h - 2);

    ctx.fillStyle = bg;
    ctx.fillRect(x + 3, y + 3, w - 6, h - 6);
    ctx.restore();
}

function drawSideUI() {
    if (!gameStarted) return;

    drawRoundedBox(exitBtnRect.x, exitBtnRect.y, exitBtnRect.width, exitBtnRect.height);
    ctx.fillStyle = '#451a03';
    ctx.fillRect(exitBtnRect.x + 11, exitBtnRect.y + 8, 14, 22);
    ctx.fillStyle = '#fde68a';
    ctx.fillRect(exitBtnRect.x + 13, exitBtnRect.y + 10, 10, 18);
    ctx.fillStyle = '#451a03';
    ctx.fillRect(exitBtnRect.x + 15, exitBtnRect.y + 12, 6, 14);
    ctx.fillStyle = '#451a03';
    ctx.fillRect(exitBtnRect.x + 18, exitBtnRect.y + 17, 12, 4);
    ctx.fillRect(exitBtnRect.x + 26, exitBtnRect.y + 14, 3, 10);
    ctx.fillRect(exitBtnRect.x + 29, exitBtnRect.y + 16, 2, 6);

    const coinBoxY = exitBtnRect.y + exitBtnRect.height + 8;
    const coinBoxW = 46;
    const coinBoxH = 26;
    drawRoundedBox(exitBtnRect.x, coinBoxY, coinBoxW, coinBoxH);
    drawFrogCoin(exitBtnRect.x + 11, coinBoxY + 13, 12);

    ctx.fillStyle = '#451a03';
    ctx.font = '8px "Press Start 2P", monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`${coins}`, exitBtnRect.x + 20, coinBoxY + 16);

    const sx = shopBtnRect.x;
    const sy = shopBtnRect.y;
    drawRoundedBox(sx, sy, shopBtnRect.width, shopBtnRect.height);

    ctx.save();
    ctx.translate(sx, sy);
    ctx.scale(0.85, 0.85);
    ctx.translate(5, 5);

    ctx.fillStyle = '#111827';
    ctx.fillRect(3, 18, 38, 20);
    ctx.fillStyle = '#facc15';
    ctx.fillRect(5, 20, 34, 16);
    ctx.fillStyle = '#fef08a';
    ctx.fillRect(5, 20, 3, 16);
    ctx.fillStyle = '#eab308';
    ctx.fillRect(5, 34, 34, 2);
    ctx.fillStyle = '#111827';
    ctx.fillRect(8, 22, 9, 14);
    ctx.fillStyle = '#f8fafc';
    ctx.fillRect(9, 23, 7, 13);
    ctx.fillStyle = '#f1f5f9';
    ctx.fillRect(10, 24, 5, 11);
    ctx.fillStyle = '#ecfeff';
    ctx.fillRect(10, 24, 2, 11);
    ctx.fillStyle = '#111827';
    ctx.fillRect(10, 29, 2, 3);
    ctx.fillStyle = '#111827';
    ctx.fillRect(20, 22, 17, 12);
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(21, 23, 15, 10);
    ctx.fillStyle = '#ca8a04';
    ctx.fillRect(21, 23, 15, 2);
    ctx.fillStyle = '#fef08a';
    ctx.fillRect(20, 32, 17, 2);
    ctx.fillStyle = '#eab308';
    ctx.fillRect(20, 33, 17, 1);
    const roofY = 2;
    ctx.fillStyle = '#111827';
    ctx.fillRect(1, roofY + 2, 42, 18);
    const stripes = [
        { type: 'red', x: 3, w: 7 }, { type: 'white', x: 10, w: 7 },
        { type: 'red', x: 17, w: 7 }, { type: 'white', x: 24, w: 7 },
        { type: 'red', x: 31, w: 7 }, { type: 'white', x: 38, w: 3 }
    ];
    stripes.forEach(s => {
        ctx.fillStyle = (s.type === 'red') ? '#dc2626' : '#fef3c7';
        ctx.fillRect(s.x, roofY + 4, s.w, 13);
        ctx.fillStyle = (s.type === 'red') ? '#f87171' : '#ffffff';
        ctx.fillRect(s.x, roofY + 4, s.w, 2);
        ctx.fillStyle = (s.type === 'red') ? '#991b1b' : '#fde047';
        ctx.fillRect(s.x, roofY + 15, s.w, 2);
    });
    ctx.fillStyle = '#111827';
    for (let i = 0; i < 5; i++) {
        ctx.fillRect(4 + i * 7, roofY + 17, 5, 2);
    }
    ctx.restore();

    const px = pauseBtnRect.x;
    const py = pauseBtnRect.y;
    drawRoundedBox(px, py, pauseBtnRect.width, pauseBtnRect.height, '#334155', '#0f172a');
    ctx.fillStyle = '#e2e8f0';
    ctx.fillRect(px + 14, py + 10, 6, 20);
    ctx.fillRect(px + 24, py + 10, 6, 20);
    ctx.fillStyle = '#94a3b8';
    ctx.fillRect(px + 14, py + 10, 2, 20);
    ctx.fillRect(px + 24, py + 10, 2, 20);
}

function drawTree(x, y) {
    ctx.fillStyle = '#4a2810';
    ctx.fillRect(x + 12, y + 26, 8, 18);
    ctx.fillStyle = '#2d1808';
    ctx.fillRect(x + 17, y + 26, 3, 18);

    ctx.fillStyle = '#1e5e27';
    ctx.fillRect(x + 2, y + 10, 28, 18);
    ctx.fillRect(x + 6, y + 2, 20, 22);

    ctx.fillStyle = '#2e8b39';
    ctx.fillRect(x + 4, y + 8, 20, 14);
    ctx.fillRect(x + 8, y + 4, 12, 18);

    ctx.fillStyle = '#4ade80';
    ctx.fillRect(x + 6, y + 6, 6, 4);
    ctx.fillRect(x + 10, y + 10, 4, 4);
}

function drawBush(x, y) {
    ctx.fillStyle = '#166534';
    ctx.fillRect(x, y + 6, 22, 12);
    ctx.fillRect(x + 3, y + 2, 16, 16);
    ctx.fillStyle = '#22c55e';
    ctx.fillRect(x + 2, y + 4, 14, 10);
    ctx.fillStyle = '#ef4444';
    ctx.fillRect(x + 4, y + 6, 3, 3);
    ctx.fillRect(x + 14, y + 9, 3, 3);
}

function drawRock(x, y) {
    ctx.fillStyle = '#334155';
    ctx.fillRect(x, y + 4, 14, 8);
    ctx.fillStyle = '#64748b';
    ctx.fillRect(x + 2, y + 2, 10, 6);
    ctx.fillStyle = '#94a3b8';
    ctx.fillRect(x + 3, y + 3, 4, 2);
}

function renderBackground() {
    ctx.fillStyle = '#0284c7';
    ctx.fillRect(BANK_WIDTH, 0, canvas.width - BANK_WIDTH * 2, canvas.height);

    const time = Date.now() * 0.002;
    const sectorWater = 70;
    const startW = Math.floor((cameraY - 100) / sectorWater);
    const endW = Math.floor((cameraY + canvas.height + 100) / sectorWater);

    for (let w = startW; w <= endW; w++) {
        let wy = w * sectorWater - cameraY;
        let rx1 = pseudoRandom(w * 11.1) * (canvas.width - BANK_WIDTH * 2 - 50) + BANK_WIDTH + 10;
        let rx2 = pseudoRandom(w * 22.2) * (canvas.width - BANK_WIDTH * 2 - 50) + BANK_WIDTH + 10;
        let waveShift = Math.sin(time + w) * 5;

        ctx.fillStyle = '#38bdf8';
        ctx.fillRect(rx1 + waveShift, wy + 15, 30, 3);
        ctx.fillRect(rx1 + waveShift + 4, wy + 18, 18, 2);
        ctx.fillStyle = '#7dd3fc';
        ctx.fillRect(rx2 - waveShift, wy + 45, 22, 2);

        if (gameStarted && pseudoRandom(w * 33.3) < 0.35) {
            let padX = BANK_WIDTH + 15 + pseudoRandom(w * 44.4) * (canvas.width - BANK_WIDTH * 2 - 30);
            ctx.fillStyle = '#15803d';
            ctx.fillRect(padX, wy + 25, 12, 8);
            ctx.fillStyle = '#22c55e';
            ctx.fillRect(padX + 2, wy + 26, 8, 6);
        }
    }

    ctx.fillStyle = '#1e3a1e';
    ctx.fillRect(0, 0, BANK_WIDTH, canvas.height);
    ctx.fillStyle = '#15803d';
    ctx.fillRect(0, 0, BANK_WIDTH - 8, canvas.height);
    ctx.fillStyle = '#22c55e';
    ctx.fillRect(0, 0, BANK_WIDTH - 18, canvas.height);

    ctx.fillStyle = '#1e3a1e';
    ctx.fillRect(canvas.width - BANK_WIDTH, 0, BANK_WIDTH, canvas.height);
    ctx.fillStyle = '#15803d';
    ctx.fillRect(canvas.width - BANK_WIDTH + 8, 0, BANK_WIDTH - 8, canvas.height);
    ctx.fillStyle = '#22c55e';
    ctx.fillRect(canvas.width - BANK_WIDTH + 18, 0, BANK_WIDTH - 18, canvas.height);

    ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
    ctx.fillRect(BANK_WIDTH, 0, 3, canvas.height);
    ctx.fillRect(canvas.width - BANK_WIDTH - 3, 0, 3, canvas.height);

    const stepY = 90;
    const startSector = Math.floor((cameraY - 100) / stepY);
    const endSector = Math.floor((cameraY + canvas.height + 100) / stepY);

    for (let s = startSector; s <= endSector; s++) {
        let screenY = s * stepY - cameraY;
        let randL = pseudoRandom(s * 14.21);
        let randR = pseudoRandom(s * 67.89);

        if (randL < 0.4) drawTree(12, screenY);
        else if (randL < 0.7) drawBush(16, screenY + 10);
        else if (randL < 0.9) drawRock(20, screenY + 12);

        if (randR < 0.4) drawTree(canvas.width - 44, screenY);
        else if (randR < 0.7) drawBush(canvas.width - 38, screenY + 10);
        else if (randR < 0.9) drawRock(canvas.width - 34, screenY + 12);
    }

    fireflies.forEach(f => {
        let alpha = (Math.sin(f.pulse) + 1) / 2 * 0.8 + 0.2;
        ctx.fillStyle = `rgba(253, 224, 71, ${alpha})`;
        ctx.fillRect(Math.round(f.x), Math.round(f.y), f.size, f.size);
    });
}

function renderMenuScene() {
    renderBackground();

    const padX = 145;
    const padY = 280;
    const padW = 110;
    const padH = 26;

    ctx.fillStyle = 'rgba(0, 20, 40, 0.4)';
    ctx.fillRect(padX + 4, padY + padH - 4, padW - 8, 8);
    ctx.fillStyle = '#15803d';
    ctx.fillRect(padX, padY, padW, padH);
    ctx.fillStyle = '#22c55e';
    ctx.fillRect(padX + 4, padY + 3, padW - 8, padH - 6);
    ctx.fillStyle = '#4ade80';
    ctx.fillRect(padX + 8, padY + 3, padW - 16, 4);

    ctx.fillStyle = '#ff4d6d';
    ctx.fillRect(padX + 12, padY - 8, 12, 12);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(padX + 16, padY - 4, 4, 4);
    ctx.fillStyle = '#ff4d6d';
    ctx.fillRect(padX + padW - 24, padY - 6, 10, 10);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(padX + padW - 20, padY - 3, 2, 2);

    drawPixelArtFrog(186, padY - 26, 'right', 0, 0, true);
}

function render() {
    if (!gameStarted) {
        renderMenuScene();
        return;
    }

    renderBackground();
    platforms.forEach(drawPixelPad);

    particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.fillRect(Math.round(p.x), Math.round(p.y - cameraY), p.size, p.size);
    });

    drawPixelArtFrog(frog.x, frog.y - cameraY, frog.facing, frog.vy, frog.squashTimer);

    if (isWaitingForSpace) {
        ctx.save();
        ctx.font = '10px "Press Start 2P", monospace';
        ctx.textAlign = 'center';
        const textX = canvas.width / 2;
        const textY = (frog.y - cameraY) - 35;
        const alpha = (Math.sin(Date.now() * 0.005) + 1) / 2 * 0.75 + 0.25;
        ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
        ctx.fillText(t('pressSpace'), textX + 2, textY + 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
        ctx.fillText(t('pressSpace'), textX, textY);
        ctx.restore();
    }

    drawSideUI();
}

function loop() {
    update();
    render();
    requestAnimationFrame(loop);
}

function startGame() {
    initAudio();
    if (!gameStarted) {
        gameStarted = true;
        mainMenu.classList.add('hidden');
        initGame();
    }
}

canvas.addEventListener('click', (e) => {
    if (!gameStarted || shopOpen || isPaused || isCountingDown || adPlaying) return;
    const rect = canvas.getBoundingClientRect();
    const clickX = (e.clientX - rect.left) * (canvas.width / rect.width);
    const clickY = (e.clientY - rect.top) * (canvas.height / rect.height);
    if (clickX >= exitBtnRect.x && clickX <= exitBtnRect.x + exitBtnRect.width &&
        clickY >= exitBtnRect.y && clickY <= exitBtnRect.y + exitBtnRect.height) {
        goToMainMenu();
        return;
    }
    if (clickX >= shopBtnRect.x && clickX <= shopBtnRect.x + shopBtnRect.width &&
        clickY >= shopBtnRect.y && clickY <= shopBtnRect.y + shopBtnRect.height) {
        openShop();
        return;
    }
    if (clickX >= pauseBtnRect.x && clickX <= pauseBtnRect.x + pauseBtnRect.width &&
        clickY >= pauseBtnRect.y && clickY <= pauseBtnRect.y + pauseBtnRect.height) {
        openPause();
    }
});

// ==================== СЕНСОРНОЕ УПРАВЛЕНИЕ (мобильные) ====================
// Не свайпы, а "зажал — потянул": палец опускается на экран, эта точка
// становится "центром", и пока палец удерживается, отклонение текущей
// позиции пальца от центра влево/вправо задаёт направление (как
// невидимый джойстик). Отпустил — движение сразу останавливается.
// Иконки exit/shop/pause по-прежнему тапаются как обычно: если палец
// опустился прямо на них, джойстик не активируется и срабатывает
// обычный 'click' выше.
let touchSteerActive = false;
let touchAnchorX = 0;
const TOUCH_STEER_DEADZONE = 8; // px в системе координат канваса — небольшая "мёртвая зона" от дрожания пальца

function toCanvasX(clientX) {
    const rect = canvas.getBoundingClientRect();
    return (clientX - rect.left) * (canvas.width / rect.width);
}
function toCanvasY(clientY) {
    const rect = canvas.getBoundingClientRect();
    return (clientY - rect.top) * (canvas.height / rect.height);
}
function isOverCanvasUiButton(clientX, clientY) {
    const cx = toCanvasX(clientX);
    const cy = toCanvasY(clientY);
    return [exitBtnRect, shopBtnRect, pauseBtnRect].some(r =>
        cx >= r.x && cx <= r.x + r.width && cy >= r.y && cy <= r.y + r.height
    );
}

function stopTouchSteering() {
    touchSteerActive = false;
    keys.left = false;
    keys.right = false;
}

canvas.addEventListener('touchstart', (e) => {
    initAudio();
    const touch = e.touches[0];
    if (!touch) return;
    if (adPlaying) return;
    // Палец попал на иконку exit/shop/pause — не мешаем обычному тапу.
    if (isOverCanvasUiButton(touch.clientX, touch.clientY)) return;
    if (!gameStarted || shopOpen || isPaused || isCountingDown) return;
    touchSteerActive = true;
    touchAnchorX = toCanvasX(touch.clientX);
    keys.left = false;
    keys.right = false;
    // Первый прыжок (после старта игры/возрождения) — по тапу, а не по
    // пробелу, которого на телефоне просто нет.
    if (isWaitingForSpace) launchFrog();
}, { passive: true });

canvas.addEventListener('touchmove', (e) => {
    if (!touchSteerActive) return;
    e.preventDefault();
    const touch = e.touches[0];
    if (!touch) return;
    const delta = toCanvasX(touch.clientX) - touchAnchorX;
    if (delta < -TOUCH_STEER_DEADZONE) {
        keys.left = true;
        keys.right = false;
    } else if (delta > TOUCH_STEER_DEADZONE) {
        keys.right = true;
        keys.left = false;
    } else {
        keys.left = false;
        keys.right = false;
    }
}, { passive: false });

canvas.addEventListener('touchend', stopTouchSteering, { passive: true });
canvas.addEventListener('touchcancel', stopTouchSteering, { passive: true });

shopBackBtn.addEventListener('click', () => { closeShop(); });
confirmYesBtn.addEventListener('click', () => { confirmPurchase(); });
confirmNoBtn.addEventListener('click', () => { closeConfirmModal(); });

document.body.addEventListener('pointerdown', () => { initAudio(); }, { once: true });

playBtn.addEventListener('click', startGame);

musicBtn.addEventListener('click', () => {
    initAudio();
    isMusicEnabled = !isMusicEnabled;
    if (isMusicEnabled) {
        musicBtn.innerText = t('musicOn');
        musicBtn.classList.remove('off');
        startBgMusic();
    } else {
        musicBtn.innerText = t('musicOff');
        musicBtn.classList.add('off');
        stopBgMusic();
    }
});

window.addEventListener('keydown', (e) => {
    initAudio();
    if (adPlaying) return;
    if (shopOpen) {
        if (e.key === 'Escape') {
            if (pendingPurchaseSkin) closeConfirmModal();
            else closeShop();
        }
        return;
    }
    if (isPaused) {
        if (e.key === 'Escape') { startCountdown(); }
        return;
    }
    if (isCountingDown) return;
    if (e.code === 'Space') { e.preventDefault(); launchFrog(); }
    // e.code завязан на физическое положение клавиши, а не на раскладку —
    // поэтому A/D работают даже если выбрана русская/другая раскладка.
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
});

window.addEventListener('keyup', (e) => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
});

restartBtn.addEventListener('click', () => {
    // Если 2.5 минуты с прошлой рекламы уже прошли — показываем
    // интерстишл ПЕРЕД рестартом; если нет — рестарт мгновенный.
    tryShowInterstitialAd(() => { initGame(); });
});

initFireflies();
applyLanguage();
updateReviveButtonUI();
loop();
</script>
